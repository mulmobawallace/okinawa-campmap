<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>キャンプ一覧 | 沖縄キャンプまとめ</title>
    <style>
      :root {
        --npb: #3b82f6;
        --npb-bg: rgba(59, 130, 246, 0.12);
        --kbo: #fb923c;
        --kbo-bg: rgba(251, 146, 60, 0.12);
        --cpbl: #f87171;
        --cpbl-bg: rgba(248, 113, 113, 0.12);
        --jleague: #34d399;
        --jleague-bg: rgba(52, 211, 153, 0.12);
        --other: #c084fc;
        --other-bg: rgba(192, 132, 252, 0.12);
        --ink: #e5e7eb;
        --muted: #8b95a5;
        --line: #26282f;
        --bg: #08090b;
        --card-bg: #131418;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
        color: var(--ink);
      }
      header {
        padding: 16px 20px 10px;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 5;
      }
      header h1 {
        font-size: 20px;
        margin: 0;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #fff;
        text-shadow: 0 0 18px rgba(59, 130, 246, 0.35);
      }
      header a.nav {
        font-size: 15px;
        font-weight: 700;
        color: #fff;
        text-decoration: none;
        border: none;
        border-radius: 999px;
        padding: 10px 20px;
        background: #3b82f6;
        box-shadow: 0 0 16px -2px rgba(59, 130, 246, 0.7);
        white-space: nowrap;
      }
      header a.nav:hover {
        background: #2563eb;
        box-shadow: 0 0 20px -1px rgba(59, 130, 246, 0.9);
      }
      header a.home {
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        text-decoration: none;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 14px;
        white-space: nowrap;
      }
      header a.home:hover {
        color: #fff;
        border-color: #fff;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        opacity: 0.35;
        transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
        color: #fff;
      }
      .chip.on {
        opacity: 1;
      }
      .chip:active {
        transform: scale(0.96);
      }
      .chip.NPB {
        background: var(--npb);
      }
      .chip.NPB.on {
        box-shadow: 0 0 14px -2px var(--npb);
      }
      .chip.KBO {
        background: var(--kbo);
      }
      .chip.KBO.on {
        box-shadow: 0 0 14px -2px var(--kbo);
      }
      .chip.CPBL {
        background: var(--cpbl);
      }
      .chip.CPBL.on {
        box-shadow: 0 0 14px -2px var(--cpbl);
      }
      .chip.Jリーグ {
        background: var(--jleague);
      }
      .chip.Jリーグ.on {
        box-shadow: 0 0 14px -2px var(--jleague);
      }
      .chip.その他 {
        background: var(--other);
      }
      .chip.その他.on {
        box-shadow: 0 0 14px -2px var(--other);
      }
      .mode-toggle {
        display: flex;
        gap: 2px;
        background: var(--card-bg);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px;
      }
      .mode-btn {
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        padding: 5px 12px;
        border-radius: 999px;
        cursor: pointer;
      }
      .mode-btn.on {
        background: #fff;
        color: #0a0a0a;
      }
      main {
        padding: 4px 20px 30px;
      }
      section.genre-section {
        margin-top: 22px;
      }
      .genre-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 12px;
        font-size: 16px;
        font-weight: 800;
      }
      .genre-title {
        color: #fff;
      }
      .genre-title .count {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        background: var(--card-bg);
        border-radius: 999px;
        padding: 2px 9px;
        border: 1px solid var(--line);
      }
      .genre-title .bar {
        width: 6px;
        height: 18px;
        border-radius: 3px;
        box-shadow: 0 0 10px 0 currentColor;
      }
      .genre-title .bar.month {
        background: #94a3b8;
        color: #94a3b8;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 14px;
      }
      .card {
        background: var(--card-bg);
        border-radius: 14px;
        padding: 14px 14px 12px;
        cursor: pointer;
        border: 1px solid var(--line);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        transition: transform 0.12s ease, box-shadow 0.15s ease, border-color 0.12s ease;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .card:hover {
        transform: translateY(-3px);
      }
      .card.NPB {
        border-color: rgba(59, 130, 246, 0.35);
        background: linear-gradient(180deg, var(--npb-bg), var(--card-bg) 60%);
      }
      .card.NPB:hover {
        border-color: var(--npb);
        box-shadow: 0 0 24px -4px var(--npb);
      }
      .card.KBO {
        border-color: rgba(251, 146, 60, 0.35);
        background: linear-gradient(180deg, var(--kbo-bg), var(--card-bg) 60%);
      }
      .card.KBO:hover {
        border-color: var(--kbo);
        box-shadow: 0 0 24px -4px var(--kbo);
      }
      .card.CPBL {
        border-color: rgba(248, 113, 113, 0.35);
        background: linear-gradient(180deg, var(--cpbl-bg), var(--card-bg) 60%);
      }
      .card.CPBL:hover {
        border-color: var(--cpbl);
        box-shadow: 0 0 24px -4px var(--cpbl);
      }
      .card.Jリーグ {
        border-color: rgba(52, 211, 153, 0.35);
        background: linear-gradient(180deg, var(--jleague-bg), var(--card-bg) 60%);
      }
      .card.Jリーグ:hover {
        border-color: var(--jleague);
        box-shadow: 0 0 24px -4px var(--jleague);
      }
      .card.その他 {
        border-color: rgba(192, 132, 252, 0.35);
        background: linear-gradient(180deg, var(--other-bg), var(--card-bg) 60%);
      }
      .card.その他:hover {
        border-color: var(--other);
        box-shadow: 0 0 24px -4px var(--other);
      }
      .card .name {
        font-size: 16px;
        font-weight: 800;
        line-height: 1.25;
        color: #fff;
      }
      .card .muni {
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
      }
      .card .dates {
        display: inline-block;
        align-self: flex-start;
        font-size: 12px;
        font-weight: 700;
        border-radius: 999px;
        padding: 3px 10px;
        color: #fff;
        margin-top: 2px;
      }
      .card.NPB .dates {
        background: var(--npb);
      }
      .card.KBO .dates {
        background: var(--kbo);
      }
      .card.CPBL .dates {
        background: var(--cpbl);
      }
      .card.Jリーグ .dates {
        background: var(--jleague);
      }
      .card.その他 .dates {
        background: var(--other);
      }
      .card .venue {
        font-size: 12px;
        color: var(--ink);
      }
      .card .info {
        font-size: 11.5px;
        color: var(--muted);
        line-height: 1.5;
      }
      .card .links {
        display: flex;
        gap: 10px;
        margin-top: 4px;
      }
      .card .links a {
        font-size: 11px;
        font-weight: 700;
        text-decoration: none;
        color: #cbd5e1;
        opacity: 0.85;
      }
      .card .links a:hover {
        text-decoration: underline;
        opacity: 1;
      }
      /* --- 開催状況（開催中・終了）の表示 --- */
      .status {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        align-self: flex-start;
        font-size: 11px;
        font-weight: 800;
        border-radius: 999px;
        padding: 2px 9px;
        white-space: nowrap;
      }
      .status.live {
        background: rgba(34, 197, 94, 0.16);
        color: #4ade80;
        border: 1px solid rgba(74, 222, 128, 0.45);
      }
      .status.live::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #4ade80;
        box-shadow: 0 0 8px #4ade80;
      }
      .status.soon {
        background: rgba(148, 163, 184, 0.12);
        color: #cbd5e1;
        border: 1px solid var(--line);
      }
      .status.ended {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--line);
      }
      .card.ended {
        opacity: 0.42;
        filter: grayscale(1);
      }
      .card.ended:hover {
        opacity: 0.75;
      }
      .live-section .genre-title .bar {
        background: #4ade80;
        color: #4ade80;
      }
      .sub-label {
        margin: 18px 0 10px;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .sub-label::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }

      /* --- カレンダー（1か月表示） --- */
      .cal-wrap {
        margin-top: 18px;
        max-width: 1100px;
      }
      .cal-nav {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .cal-nav h2 {
        margin: 0;
        font-size: 22px;
        font-weight: 800;
        color: #fff;
        min-width: 150px;
      }
      .cal-nav .count {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
      }
      .cal-arrow {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--card-bg);
        color: #fff;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        line-height: 1;
      }
      .cal-arrow:hover:not(:disabled) {
        border-color: #fff;
      }
      .cal-arrow:disabled {
        opacity: 0.25;
        cursor: default;
      }
      .cal-today-btn {
        margin-left: auto;
        border: 1px solid var(--line);
        background: var(--card-bg);
        color: var(--ink);
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }
      .cal-today-btn:hover {
        border-color: #fff;
        color: #fff;
      }
      .month-tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .month-tab {
        border: 1px solid var(--line);
        background: var(--card-bg);
        color: var(--ink);
        border-radius: 10px;
        padding: 6px 12px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: baseline;
        gap: 5px;
      }
      .month-tab small {
        font-size: 10.5px;
        font-weight: 600;
        color: var(--muted);
      }
      .month-tab.past {
        opacity: 0.4;
      }
      .month-tab.now {
        border-color: rgba(74, 222, 128, 0.6);
      }
      .month-tab.now::after {
        content: "今月";
        font-size: 10px;
        color: #4ade80;
      }
      .month-tab.on {
        background: #fff;
        color: #0a0a0a;
        opacity: 1;
        border-color: #fff;
      }
      .month-tab.on small {
        color: #475569;
      }
      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .legend i {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        display: inline-block;
      }
      .cal-board {
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        background: var(--card-bg);
      }
      .cal-head {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        background: #0e0f12;
        border-bottom: 1px solid var(--line);
      }
      .cal-head div {
        text-align: center;
        font-size: 12px;
        font-weight: 800;
        color: var(--muted);
        padding: 8px 0;
      }
      .cal-head .sun,
      .cal-day.sun .num {
        color: #f87171;
      }
      .cal-head .sat,
      .cal-day.sat .num {
        color: #60a5fa;
      }
      .cal-week {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        grid-auto-rows: 24px;
        row-gap: 3px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--line);
        min-height: 84px;
        position: relative;
      }
      .cal-week:last-child {
        border-bottom: none;
      }
      .cal-day {
        min-width: 0;
        border-right: 1px solid var(--line);
        padding: 4px 6px;
        margin-bottom: -6px;
      }
      .cal-day:nth-child(7) {
        border-right: none;
      }
      .cal-day .num {
        font-size: 12.5px;
        font-weight: 700;
        color: var(--ink);
      }
      .cal-day.out {
        background: rgba(0, 0, 0, 0.25);
      }
      .cal-day.out .num {
        opacity: 0.3;
      }
      .cal-day.today {
        background: rgba(74, 222, 128, 0.07);
      }
      .cal-day.today .num {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #4ade80;
        color: #052e14 !important;
      }
      .cal-bar {
        z-index: 1;
        margin: 0 3px;
        font-size: 12px;
        font-weight: 700;
        color: #fff;
        border-radius: 6px;
        padding: 0 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
        display: flex;
        align-items: center;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      }
      .cal-bar:hover {
        filter: brightness(1.15);
      }
      .cal-bar.cont-left {
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
        margin-left: 0;
      }
      .cal-bar.cont-right {
        border-top-right-radius: 0;
        border-bottom-right-radius: 0;
        margin-right: 0;
      }
      .cal-bar.ended {
        opacity: 0.4;
        filter: grayscale(0.8);
      }
      .cal-bar.NPB {
        background: var(--npb);
      }
      .cal-bar.KBO {
        background: var(--kbo);
      }
      .cal-bar.CPBL {
        background: var(--cpbl);
      }
      .cal-bar.Jリーグ {
        background: var(--jleague);
        color: #04140c;
      }
      .cal-bar.その他 {
        background: var(--other);
      }
      .cal-empty {
        padding: 14px 16px;
        font-size: 13px;
        color: var(--muted);
      }
      .cal-list {
        margin-top: 20px;
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }
      .cal-list h3 {
        margin: 0;
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 800;
        color: #fff;
        background: #0e0f12;
        border-bottom: 1px solid var(--line);
      }
      .cal-row {
        display: grid;
        grid-template-columns: 10px minmax(0, 1fr) auto;
        gap: 4px 12px;
        align-items: center;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
        background: var(--card-bg);
      }
      .cal-row:last-child {
        border-bottom: none;
      }
      .cal-row:hover {
        background: #1a1c21;
      }
      .cal-row.ended {
        opacity: 0.45;
      }
      .cal-row .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .cal-row .nm {
        font-size: 14px;
        font-weight: 700;
        color: #fff;
      }
      .cal-row .where {
        grid-column: 2;
        font-size: 12px;
        color: var(--muted);
      }
      .cal-row .when {
        grid-column: 3;
        grid-row: 1 / span 2;
        text-align: right;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--ink);
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
      }
      .empty,
      .err {
        padding: 40px 20px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
      }
      .err {
        color: #f87171;
      }
      /* Detail modal (read-only) */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 20;
        padding: 20px;
      }
      .overlay.open {
        display: flex;
      }
      .modal {
        background: var(--card-bg);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 22px;
        max-width: 420px;
        width: 100%;
        max-height: 85vh;
        overflow-y: auto;
      }
      .modal .name {
        font-size: 20px;
        font-weight: 800;
        color: #fff;
        margin-bottom: 6px;
      }
      .modal .row {
        font-size: 13px;
        line-height: 1.6;
        color: var(--ink);
        margin: 6px 0;
      }
      .modal .row b {
        color: var(--muted);
        font-weight: 600;
      }
      .modal .close {
        margin-top: 16px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        border-radius: 8px;
        padding: 6px 14px;
        cursor: pointer;
        font-size: 12px;
      }

      /* --- Mobile layout --- */
      @media (max-width: 600px) {
        header {
          padding: 12px 14px 8px;
          gap: 10px;
        }
        header h1 {
          font-size: 17px;
          width: 100%;
        }
        header a.home {
          font-size: 12px;
          padding: 6px 12px;
          order: 1;
        }
        header a.nav {
          font-size: 13px;
          padding: 8px 16px;
          order: 2;
        }
        .mode-toggle {
          order: 3;
        }
        .chips {
          order: 4;
          width: 100%;
        }
        .chip {
          font-size: 11px;
          padding: 5px 10px;
        }
        main {
          padding: 4px 12px 24px;
        }
        .grid {
          grid-template-columns: 1fr;
          gap: 10px;
        }
        .card {
          padding: 12px 12px 10px;
        }
        .modal {
          padding: 16px;
          max-width: 100%;
        }
        .cal-nav h2 {
          font-size: 18px;
          min-width: 0;
        }
        .cal-week {
          grid-auto-rows: 18px;
          min-height: 64px;
        }
        .cal-day {
          padding: 3px 3px;
        }
        .cal-day .num {
          font-size: 11px;
        }
        .cal-day.today .num {
          width: 18px;
          height: 18px;
        }
        .cal-bar {
          font-size: 10px;
          padding: 0 4px;
          margin: 0 1px;
          border-radius: 4px;
        }
        .cal-head div {
          font-size: 11px;
        }
        .cal-row .nm {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>沖縄キャンプ図鑑</h1>
      <div class="mode-toggle" id="yearToggle"></div>
      <div class="mode-toggle" id="modeToggle">
        <button class="mode-btn on" data-mode="genre">ジャンル別</button>
        <button class="mode-btn" data-mode="month">カレンダー</button>
      </div>
      <div class="chips" id="chips">
        <button class="chip NPB on" data-genre="NPB">NPB</button>
        <button class="chip KBO on" data-genre="KBO">KBO</button>
        <button class="chip CPBL on" data-genre="CPBL">CPBL</button>
        <button class="chip Jリーグ on" data-genre="Jリーグ">Jリーグ</button>
        <button class="chip その他 on" data-genre="その他">その他</button>
      </div>
      <div style="flex:1"></div>
      <a class="home" href="index.html">🏠 トップ</a>
      <a class="nav" href="map.html">🗺️ 地図表示</a>

    </header>
    <main id="main">
      <div class="empty">読み込み中…</div>
    </main>

    <div class="overlay" id="overlay">
      <div class="modal" id="modalBody"></div>
    </div>

    <script>
      const GENRE_ORDER = ["NPB", "KBO", "CPBL", "Jリーグ", "その他"];
      const GENRE_COLOR = { NPB: "#2563eb", KBO: "#ea580c", CPBL: "#dc2626", Jリーグ: "#16a34a", その他: "#7c3aed" };
      let activeGenres = new Set(GENRE_ORDER);
      let itemsCache = [];
      let itemsById = {};
      let groupMode = "genre"; // "genre" | "month"
      let activeYear = null; // null = defaultYear() で自動選択

      // 初期表示の年度: 今年（日本時間）のデータがあれば今年、なければ今年以前で最新の年度、それもなければ最新の年度。
      // 例: 2026年中は2026年、2027年1月1日からは2027年が初期表示になる（翌年分を先に登録しても切り替わらない）。
      function defaultYear(years) {
        if (!years.length) return null;
        const thisYear = new Date(Date.now() + 9 * 3600 * 1000).getUTCFullYear();
        if (years.includes(thisYear)) return thisYear;
        const past = years.filter((y) => y < thisYear);
        return past.length ? Math.max(...past) : Math.max(...years);
      }

      function yearOf(it) {
        if (it.year) return Number(it.year);
        const d = it.startDate || it.endDate;
        return d ? parseInt(String(d).slice(0, 4), 10) : null;
      }

      function renderYearToggle(items) {
        const years = [...new Set(items.map(yearOf).filter(Boolean))].sort((a, b) => b - a);
        if (activeYear == null || !years.includes(activeYear)) activeYear = defaultYear(years);
        const el = document.getElementById("yearToggle");
        el.style.display = years.length ? "" : "none";
        el.innerHTML = years
          .map((y) => '<button class="mode-btn' + (y === activeYear ? " on" : "") + '" data-year="' + y + '">' + y + "年</button>")
          .join("");
      }

      function esc(s) {
        return (s == null ? "" : String(s)).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      }

      function dateRange(it) {
        const s = it.startDate || "";
        const e = it.endDate || "";
        if (!s && !e) return "日程未定";
        return s + (e && e !== s ? " 〜 " + e : "");
      }

      // 今日の日付（日本時間, YYYY-MM-DD）。開催中・終了の判定と、カレンダーの「今月」に使う。
      const TODAY = new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);

      // 開催状況: "ongoing"（開催中）/ "upcoming"（これから）/ "ended"（終了）/ "tbd"（日程未定）
      function statusOf(it) {
        if (!it.startDate) return "tbd";
        const end = it.endDate || it.startDate;
        if (end < TODAY) return "ended";
        if (it.startDate > TODAY) return "upcoming";
        return "ongoing";
      }

      function daysFromToday(dateStr) {
        return Math.round((parseISO(dateStr) - parseISO(TODAY)) / 86400000);
      }

      function statusBadge(it) {
        const st = statusOf(it);
        if (st === "ongoing") {
          if (!it.endDate) return '<span class="status live">開催中</span>';
          const left = daysFromToday(it.endDate);
          return '<span class="status live">' + (left === 0 ? "開催中・本日まで" : "開催中・残り" + (left + 1) + "日") + "</span>";
        }
        if (st === "upcoming") {
          const d = daysFromToday(it.startDate);
          return d <= 30 ? '<span class="status soon">あと' + d + "日で開始</span>" : "";
        }
        if (st === "ended") return '<span class="status ended">終了</span>';
        return "";
      }

      // 並び順: 開催中 → これから（開始日順）→ 日程未定 → 終了（開始日順）
      const STATUS_RANK = { ongoing: 0, upcoming: 1, tbd: 2, ended: 3 };
      function byStatusThenDate(a, b) {
        return STATUS_RANK[statusOf(a)] - STATUS_RANK[statusOf(b)] || (a.startDate || "").localeCompare(b.startDate || "");
      }

      function cardHtml(it) {
        const g = GENRE_ORDER.includes(it.genre) ? it.genre : "その他";
        const ended = statusOf(it) === "ended";
        let html = '<div class="card ' + g + (ended ? " ended" : "") + '" data-id="' + esc(it.id) + '">';
        html += '<div class="name">' + esc(it.name || it.id) + "</div>";
        html += statusBadge(it);
        if (it.municipality) html += '<div class="muni">📍 ' + esc(it.municipality) + "</div>";
        html += '<div class="dates">' + esc(dateRange(it)) + "</div>";
        if (it.venue) html += '<div class="venue">' + esc(it.venue) + "</div>";
        const infoParts = [];
        if (it.publicInfo) infoParts.push("公開/料金: " + it.publicInfo);
        if (it.parking) infoParts.push("駐車場: " + it.parking);
        if (infoParts.length) html += '<div class="info">' + esc(infoParts.join(" ／ ")) + "</div>";
        const links = [];
        if (it.official) links.push('<a href="' + esc(it.official) + '" target="_blank" rel="noopener">🔗 公式サイト</a>');
        if (it.sns) links.push('<a href="' + esc(it.sns) + '" target="_blank" rel="noopener">📣 SNS</a>');
        if (links.length) html += '<div class="links">' + links.join("") + "</div>";
        html += "</div>";
        return html;
      }

      // ジャンルなどの1セクション。これからのキャンプを先に、終了したキャンプは「終了したキャンプ」の見出しの下にグレーで並べる。
      function sectionHtml(barHtml, titleText, list, extraClass) {
        list.sort(byStatusThenDate);
        const active = list.filter((it) => statusOf(it) !== "ended");
        const ended = list.filter((it) => statusOf(it) === "ended");
        let html = '<section class="genre-section' + (extraClass ? " " + extraClass : "") + '">';
        html += '<div class="genre-title">' + barHtml + esc(titleText) + ' <span class="count">' + list.length + "件</span></div>";
        if (active.length) html += '<div class="grid">' + active.map(cardHtml).join("") + "</div>";
        if (ended.length) {
          html += '<div class="sub-label">終了したキャンプ（' + ended.length + "件）</div>";
          html += '<div class="grid">' + ended.map(cardHtml).join("") + "</div>";
        }
        html += "</section>";
        return html;
      }

      const WEEKDAY_LABELS = ["日", "月", "火", "水", "木", "金", "土"];

      function pad2(n) {
        return n < 10 ? "0" + n : "" + n;
      }

      function daysInMonth(year, month) {
        return new Date(year, month, 0).getDate();
      }

      function parseISO(s) {
        return new Date(s + "T00:00:00");
      }

      function formatMD(dateStr) {
        const parts = String(dateStr).split("-");
        return parseInt(parts[1], 10) + "/" + parseInt(parts[2], 10);
      }

      // "1/11〜1/25"-style compact range label for an item's camp period.
      function rangeLabel(it) {
        const s = formatMD(it.startDate);
        if (!it.endDate || it.endDate === it.startDate) return s;
        return s + "〜" + formatMD(it.endDate);
      }

      // Every year-month ("YYYY-MM") an item's [startDate, endDate] range touches.
      function monthsForItem(it) {
        const s = parseISO(it.startDate);
        const e = parseISO(it.endDate || it.startDate);
        const keys = [];
        let y = s.getFullYear();
        let m = s.getMonth() + 1;
        const endY = e.getFullYear();
        const endM = e.getMonth() + 1;
        let guard = 0;
        while ((y < endY || (y === endY && m <= endM)) && guard < 36) {
          keys.push(y + "-" + pad2(m));
          m++;
          if (m > 12) {
            m = 1;
            y++;
          }
          guard++;
        }
        return keys;
      }

      // Full Sun-Sat weeks covering the given month, as arrays of 7 Date objects
      // (weeks at the start/end of the month include days from the adjacent month).
      function buildWeeks(year, month) {
        const firstOfMonth = new Date(year, month - 1, 1);
        const gridStart = new Date(year, month - 1, 1 - firstOfMonth.getDay());
        const lastOfMonth = new Date(year, month - 1, daysInMonth(year, month));
        const weeks = [];
        let cursor = new Date(gridStart);
        let guard = 0;
        while (guard < 10) {
          const week = [];
          for (let i = 0; i < 7; i++) {
            week.push(new Date(cursor));
            cursor.setDate(cursor.getDate() + 1);
          }
          weeks.push(week);
          if (week[6] >= lastOfMonth) break;
          guard++;
        }
        return weeks;
      }

      // 1か月分のカレンダー盤面。各キャンプの期間を1本の帯で描き、週をまたぐと次の行に折り返す。
      // 同じ日に複数のキャンプがあるときは段（レーン）を分けて重ならないようにする。
      function monthBoardHtml(year, month, items) {
        const weeks = buildWeeks(year, month);
        let weeksHtml = "";

        for (const week of weeks) {
          const weekStart = week[0];
          const weekEnd = week[6];
          const events = [];
          for (const it of items) {
            const s = parseISO(it.startDate);
            const e = parseISO(it.endDate || it.startDate);
            if (e < weekStart || s > weekEnd) continue;
            const segStart = s < weekStart ? weekStart : s;
            const segEnd = e > weekEnd ? weekEnd : e;
            const colStart = Math.round((segStart - weekStart) / 86400000);
            const colEnd = Math.round((segEnd - weekStart) / 86400000);
            events.push({ it, colStart, colEnd, contLeft: s < weekStart, contRight: e > weekEnd });
          }
          // Lane assignment: earliest-starting / longest events get priority,
          // each lane keeps the rightmost column it is occupied through.
          events.sort((a, b) => a.colStart - b.colStart || b.colEnd - b.colStart - (a.colEnd - a.colStart));
          const laneEnd = [];
          for (const ev of events) {
            let placed = false;
            for (let L = 0; L < laneEnd.length; L++) {
              if (laneEnd[L] < ev.colStart) {
                laneEnd[L] = ev.colEnd;
                ev.lane = L;
                placed = true;
                break;
              }
            }
            if (!placed) {
              ev.lane = laneEnd.length;
              laneEnd.push(ev.colEnd);
            }
          }

          // 1行目 = 日付、2行目以降 = 帯の段。日付のマスは全段の高さに広げる。
          const rowSpan = Math.max(laneEnd.length, 2) + 1;
          let daysHtml = "";
          week.forEach((d, i) => {
            const iso = d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
            const cls = ["cal-day"];
            if (d.getMonth() + 1 !== month) cls.push("out");
            if (iso === TODAY) cls.push("today");
            if (i === 0) cls.push("sun");
            if (i === 6) cls.push("sat");
            daysHtml += '<div class="' + cls.join(" ") + '" style="grid-column:' + (i + 1) + "; grid-row: 1 / span " + rowSpan + ';"><span class="num">' + d.getDate() + "</span></div>";
          });

          let barsHtml = "";
          for (const ev of events) {
            const g = GENRE_ORDER.includes(ev.it.genre) ? ev.it.genre : "その他";
            const cls = ["cal-bar", g];
            if (ev.contLeft) cls.push("cont-left");
            if (ev.contRight) cls.push("cont-right");
            if (statusOf(ev.it) === "ended") cls.push("ended");
            const name = esc(ev.it.name || ev.it.id);
            barsHtml +=
              '<div class="' + cls.join(" ") + '" data-id="' + esc(ev.it.id) + '" title="' + name + " " + esc(rangeLabel(ev.it)) + '"' +
              ' style="grid-column:' + (ev.colStart + 1) + " / " + (ev.colEnd + 2) + "; grid-row:" + (ev.lane + 2) + ';">' +
              (ev.contLeft ? "… " : "") + name + "</div>";
          }

          weeksHtml += '<div class="cal-week">' + daysHtml + barsHtml + "</div>";
        }

        const head = WEEKDAY_LABELS.map((w, i) => '<div class="' + (i === 0 ? "sun" : i === 6 ? "sat" : "") + '">' + w + "</div>").join("");
        return '<div class="cal-board"><div class="cal-head">' + head + "</div>" + weeksHtml + "</div>";
      }

      // 指定の月（YYYY-MM）に期間が重なるキャンプ
      function itemsInMonth(items, key) {
        return items.filter((it) => monthsForItem(it).includes(key));
      }

      // 初めて開いたときの月: 今月にキャンプがあれば今月、すべて先の月なら最初の月、それ以外は今月より前で最後の月
      let calMonth = null;
      function defaultMonth(keys) {
        const cur = TODAY.slice(0, 7);
        if (keys.includes(cur)) return cur;
        if (keys.every((k) => k > cur)) return keys[0];
        const past = keys.filter((k) => k < cur);
        return past.length ? past[past.length - 1] : keys[0];
      }

      // カレンダー表示全体: 月の切り替え（‹ › とタブ）＋ 1か月の盤面 ＋ その月のキャンプ一覧
      function calendarViewHtml(dated) {
        const cur = TODAY.slice(0, 7);
        const keySet = new Set();
        for (const it of dated) monthsForItem(it).forEach((k) => keySet.add(k));
        if (activeYear === Number(TODAY.slice(0, 4))) keySet.add(cur); // 今年を表示中は、キャンプがなくても今月を選べるようにする
        const keys = [...keySet].sort();
        if (!keys.length) return "";
        if (!calMonth || !keys.includes(calMonth)) calMonth = defaultMonth(keys);
        const idx = keys.indexOf(calMonth);
        const [y, m] = calMonth.split("-").map(Number);
        const monthItems = itemsInMonth(dated, calMonth).sort(byStatusThenDate);

        let html = '<div class="cal-wrap">';
        html += '<div class="cal-nav">';
        html += '<button class="cal-arrow" data-month="' + (keys[idx - 1] || "") + '"' + (idx > 0 ? "" : " disabled") + ' aria-label="前の月">‹</button>';
        html += "<h2>" + y + "年" + m + "月</h2>";
        html += '<button class="cal-arrow" data-month="' + (keys[idx + 1] || "") + '"' + (idx < keys.length - 1 ? "" : " disabled") + ' aria-label="次の月">›</button>';
        html += '<span class="count">' + monthItems.length + "件</span>";
        if (keys.includes(cur) && calMonth !== cur) html += '<button class="cal-today-btn" data-month="' + cur + '">今月に戻る</button>';
        html += "</div>";

        html += '<div class="month-tabs">';
        for (const k of keys) {
          const [ky, km] = k.split("-").map(Number);
          const n = itemsInMonth(dated, k).length;
          const cls = ["month-tab"];
          if (k < cur) cls.push("past");
          if (k === cur) cls.push("now");
          if (k === calMonth) cls.push("on");
          html += '<button class="' + cls.join(" ") + '" data-month="' + k + '">' + (ky !== y ? ky + "年" : "") + km + "月<small>" + n + "件</small></button>";
        }
        html += "</div>";

        html += '<div class="legend">';
        for (const g of GENRE_ORDER) if (activeGenres.has(g)) html += '<span><i style="background:' + GENRE_COLOR[g] + '"></i>' + g + "</span>";
        html += '<span><i style="background:#4ade80;border-radius:50%"></i>今日</span><span><i style="background:#555"></i>終了</span></div>';

        html += monthBoardHtml(y, m, dated);

        html += '<div class="cal-list"><h3>' + m + "月のキャンプ（" + monthItems.length + "件）</h3>";
        if (!monthItems.length) html += '<div class="cal-empty">この月のキャンプはありません。</div>';
        for (const it of monthItems) {
          const g = GENRE_ORDER.includes(it.genre) ? it.genre : "その他";
          html +=
            '<div class="cal-row' + (statusOf(it) === "ended" ? " ended" : "") + '" data-id="' + esc(it.id) + '">' +
            '<span class="dot" style="background:' + GENRE_COLOR[g] + '"></span>' +
            '<span class="nm">' + esc(it.name || it.id) + "</span>" +
            '<span class="when">' + esc(rangeLabel(it)) + statusBadge(it) + "</span>" +
            '<span class="where">' + esc([it.municipality, it.venue].filter(Boolean).join(" ・ ")) + "</span>" +
            "</div>";
        }
        html += "</div></div>";
        return html;
      }

      function render(items) {
        const main = document.getElementById("main");
        if (!items.length) {
          main.innerHTML = '<div class="empty">レコードがありません</div>';
          return;
        }
        renderYearToggle(items);
        const visible = items.filter((it) => (activeYear == null || yearOf(it) === activeYear) && activeGenres.has(GENRE_ORDER.includes(it.genre) ? it.genre : "その他"));

        let html = "";
        if (groupMode === "genre") {
          // 開催中のキャンプはジャンルに関係なく一番上にまとめる
          const live = visible.filter((it) => statusOf(it) === "ongoing");
          if (live.length) {
            live.sort((a, b) => (a.endDate || "9999").localeCompare(b.endDate || "9999"));
            html += '<section class="genre-section live-section"><div class="genre-title"><span class="bar"></span>🟢 開催中 <span class="count">' + live.length + "件</span></div>";
            html += '<div class="grid">' + live.map(cardHtml).join("") + "</div></section>";
          }
          const byGenre = {};
          for (const g of GENRE_ORDER) byGenre[g] = [];
          for (const it of visible) if (statusOf(it) !== "ongoing") byGenre[GENRE_ORDER.includes(it.genre) ? it.genre : "その他"].push(it);
          for (const g of GENRE_ORDER) {
            const list = byGenre[g];
            if (!list.length) continue;
            const bar = '<span class="bar" style="background:' + GENRE_COLOR[g] + ";color:" + GENRE_COLOR[g] + '"></span>';
            html += sectionHtml(bar, g, list);
          }
        } else {
          const dated = [];
          const none = [];
          for (const it of visible) (it.startDate ? dated : none).push(it);
          html += calendarViewHtml(dated);
          if (none.length) html += sectionHtml('<span class="bar month"></span>', "日程未定", none);
        }
        main.innerHTML = html || '<div class="empty">該当するチームがありません</div>';
        main.querySelectorAll(".card, .cal-bar, .cal-row").forEach((el) => {
          el.onclick = () => openDetail(el.dataset.id);
        });
        main.querySelectorAll("[data-month]").forEach((el) => {
          el.onclick = () => {
            if (!el.dataset.month) return;
            calMonth = el.dataset.month;
            render(itemsCache);
          };
        });
      }

      function openDetail(id) {
        const it = itemsById[id];
        if (!it) return;
        let html = '<div class="name">' + esc(it.name || it.id) + "</div>";
        html += '<div class="row"><b>ジャンル:</b> ' + esc(it.genre || "") + "</div>";
        if (it.municipality || it.venue) html += '<div class="row"><b>場所:</b> ' + esc(it.municipality || "") + (it.venue ? " / " + esc(it.venue) : "") + "</div>";
        const dr = dateRange(it);
        if (dr) html += '<div class="row"><b>日程:</b> ' + esc(dr) + "</div>";
        if (it.publicInfo) html += '<div class="row"><b>公開/料金:</b> ' + esc(it.publicInfo) + "</div>";
        if (it.parking) html += '<div class="row"><b>駐車場:</b> ' + esc(it.parking) + "</div>";
        if (it.notes) html += '<div class="row"><b>備考:</b> ' + esc(it.notes) + "</div>";
        if (it.official) html += '<div class="row"><b>公式:</b> <a href="' + esc(it.official) + '" target="_blank" rel="noopener" style="color:#9ec5ff">サイトを開く</a></div>';
        if (it.sns) html += '<div class="row"><b>SNS:</b> <a href="' + esc(it.sns) + '" target="_blank" rel="noopener" style="color:#9ec5ff">開く</a></div>';
        html += '<button class="close" id="closeModal">閉じる</button>';
        document.getElementById("modalBody").innerHTML = html;
        document.getElementById("overlay").classList.add("open");
        document.getElementById("closeModal").onclick = closeDetail;
      }

      function closeDetail() {
        document.getElementById("overlay").classList.remove("open");
      }

      document.getElementById("overlay").addEventListener("click", (e) => {
        if (e.target.id === "overlay") closeDetail();
      });

      document.getElementById("modeToggle").addEventListener("click", (e) => {
        const btn = e.target.closest(".mode-btn");
        if (!btn || btn.classList.contains("on")) return;
        groupMode = btn.dataset.mode;
        document.querySelectorAll("#modeToggle .mode-btn").forEach((b) => b.classList.toggle("on", b === btn));
        render(itemsCache);
      });

      document.getElementById("yearToggle").addEventListener("click", (e) => {
        const btn = e.target.closest(".mode-btn");
        if (!btn || btn.classList.contains("on")) return;
        activeYear = Number(btn.dataset.year);
        calMonth = null; // 年度を変えたら、その年度の初期の月に戻す
        render(itemsCache);
      });

      document.getElementById("chips").addEventListener("click", (e) => {
        const chip = e.target.closest(".chip");
        if (!chip) return;
        const g = chip.dataset.genre;
        if (activeGenres.has(g)) {
          activeGenres.delete(g);
          chip.classList.remove("on");
        } else {
          activeGenres.add(g);
          chip.classList.add("on");
        }
        render(itemsCache);
      });

      async function load() {
        const res = await fetch("data.json");
        if (!res.ok) throw new Error("読み込み失敗 (" + res.status + ")");
        return res.json();
      }

      async function main() {
        itemsCache = await load();
        itemsById = Object.fromEntries(itemsCache.map((it) => [it.id, it]));
        render(itemsCache);
      }

      main().catch((e) => {
        document.getElementById("main").innerHTML = '<div class="err">読み込みに失敗しました: ' + esc(e.message) + "</div>";
      });
    </script>
  </body>
</html>
