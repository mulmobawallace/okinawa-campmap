<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --npb: #3b82f6;
        --npb-bg: rgba(59, 130, 246, 0.12);
        --kbo: #fb923c;
        --kbo-bg: rgba(251, 146, 60, 0.12);
        --cpbl: #f87171;
        --cpbl-bg: rgba(248, 113, 113, 0.12);
        --jleague: #34d399;
        --jleague-bg: rgba(52, 211, 153, 0.12);
        --other: #c084fc;
        --other-bg: rgba(192, 132, 252, 0.12);
        --ink: #e5e7eb;
        --muted: #8b95a5;
        --line: #26282f;
        --bg: #08090b;
        --card-bg: #131418;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
        color: var(--ink);
      }
      header {
        padding: 16px 20px 10px;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 5;
      }
      header h1 {
        font-size: 20px;
        margin: 0;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #fff;
        text-shadow: 0 0 18px rgba(59, 130, 246, 0.35);
      }
      header a.nav {
        font-size: 15px;
        font-weight: 700;
        color: #fff;
        text-decoration: none;
        border: none;
        border-radius: 999px;
        padding: 10px 20px;
        background: #3b82f6;
        box-shadow: 0 0 16px -2px rgba(59, 130, 246, 0.7);
        white-space: nowrap;
      }
      header a.nav:hover {
        background: #2563eb;
        box-shadow: 0 0 20px -1px rgba(59, 130, 246, 0.9);
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        opacity: 0.35;
        transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
        color: #fff;
      }
      .chip.on {
        opacity: 1;
      }
      .chip:active {
        transform: scale(0.96);
      }
      .chip.NPB {
        background: var(--npb);
      }
      .chip.NPB.on {
        box-shadow: 0 0 14px -2px var(--npb);
      }
      .chip.KBO {
        background: var(--kbo);
      }
      .chip.KBO.on {
        box-shadow: 0 0 14px -2px var(--kbo);
      }
      .chip.CPBL {
        background: var(--cpbl);
      }
      .chip.CPBL.on {
        box-shadow: 0 0 14px -2px var(--cpbl);
      }
      .chip.Jリーグ {
        background: var(--jleague);
      }
      .chip.Jリーグ.on {
        box-shadow: 0 0 14px -2px var(--jleague);
      }
      .chip.その他 {
        background: var(--other);
      }
      .chip.その他.on {
        box-shadow: 0 0 14px -2px var(--other);
      }
      .mode-toggle {
        display: flex;
        gap: 2px;
        background: var(--card-bg);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px;
      }
      .mode-btn {
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        padding: 5px 12px;
        border-radius: 999px;
        cursor: pointer;
      }
      .mode-btn.on {
        background: #fff;
        color: #0a0a0a;
      }
      main {
        padding: 4px 20px 30px;
      }
      section.genre-section {
        margin-top: 22px;
      }
      .genre-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 12px;
        font-size: 16px;
        font-weight: 800;
      }
      .genre-title {
        color: #fff;
      }
      .genre-title .count {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        background: var(--card-bg);
        border-radius: 999px;
        padding: 2px 9px;
        border: 1px solid var(--line);
      }
      .genre-title .bar {
        width: 6px;
        height: 18px;
        border-radius: 3px;
        box-shadow: 0 0 10px 0 currentColor;
      }
      .genre-title .bar.month {
        background: #94a3b8;
        color: #94a3b8;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 14px;
      }
      .card {
        background: var(--card-bg);
        border-radius: 14px;
        padding: 14px 14px 12px;
        cursor: pointer;
        border: 1px solid var(--line);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        transition: transform 0.12s ease, box-shadow 0.15s ease, border-color 0.12s ease;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .card:hover {
        transform: translateY(-3px);
      }
      .card.NPB {
        border-color: rgba(59, 130, 246, 0.35);
        background: linear-gradient(180deg, var(--npb-bg), var(--card-bg) 60%);
      }
      .card.NPB:hover {
        border-color: var(--npb);
        box-shadow: 0 0 24px -4px var(--npb);
      }
      .card.KBO {
        border-color: rgba(251, 146, 60, 0.35);
        background: linear-gradient(180deg, var(--kbo-bg), var(--card-bg) 60%);
      }
      .card.KBO:hover {
        border-color: var(--kbo);
        box-shadow: 0 0 24px -4px var(--kbo);
      }
      .card.CPBL {
        border-color: rgba(248, 113, 113, 0.35);
        background: linear-gradient(180deg, var(--cpbl-bg), var(--card-bg) 60%);
      }
      .card.CPBL:hover {
        border-color: var(--cpbl);
        box-shadow: 0 0 24px -4px var(--cpbl);
      }
      .card.Jリーグ {
        border-color: rgba(52, 211, 153, 0.35);
        background: linear-gradient(180deg, var(--jleague-bg), var(--card-bg) 60%);
      }
      .card.Jリーグ:hover {
        border-color: var(--jleague);
        box-shadow: 0 0 24px -4px var(--jleague);
      }
      .card.その他 {
        border-color: rgba(192, 132, 252, 0.35);
        background: linear-gradient(180deg, var(--other-bg), var(--card-bg) 60%);
      }
      .card.その他:hover {
        border-color: var(--other);
        box-shadow: 0 0 24px -4px var(--other);
      }
      .card .name {
        font-size: 16px;
        font-weight: 800;
        line-height: 1.25;
        color: #fff;
      }
      .card .muni {
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
      }
      .card .dates {
        display: inline-block;
        align-self: flex-start;
        font-size: 12px;
        font-weight: 700;
        border-radius: 999px;
        padding: 3px 10px;
        color: #fff;
        margin-top: 2px;
      }
      .card.NPB .dates {
        background: var(--npb);
      }
      .card.KBO .dates {
        background: var(--kbo);
      }
      .card.CPBL .dates {
        background: var(--cpbl);
      }
      .card.Jリーグ .dates {
        background: var(--jleague);
      }
      .card.その他 .dates {
        background: var(--other);
      }
      .card .venue {
        font-size: 12px;
        color: var(--ink);
      }
      .card .info {
        font-size: 11.5px;
        color: var(--muted);
        line-height: 1.5;
      }
      .card .links {
        display: flex;
        gap: 10px;
        margin-top: 4px;
      }
      .card .links a {
        font-size: 11px;
        font-weight: 700;
        text-decoration: none;
        color: #cbd5e1;
        opacity: 0.85;
      }
      .card .links a:hover {
        text-decoration: underline;
        opacity: 1;
      }
      .empty,
      .err {
        padding: 40px 20px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
      }
      .err {
        color: #f87171;
      }
      /* Detail modal (read-only) */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 20;
        padding: 20px;
      }
      .overlay.open {
        display: flex;
      }
      .modal {
        background: var(--card-bg);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 22px;
        max-width: 420px;
        width: 100%;
        max-height: 85vh;
        overflow-y: auto;
      }
      .modal .name {
        font-size: 20px;
        font-weight: 800;
        color: #fff;
        margin-bottom: 6px;
      }
      .modal .row {
        font-size: 13px;
        line-height: 1.6;
        color: var(--ink);
        margin: 6px 0;
      }
      .modal .row b {
        color: var(--muted);
        font-weight: 600;
      }
      .modal .close {
        margin-top: 16px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        border-radius: 8px;
        padding: 6px 14px;
        cursor: pointer;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>沖縄キャンプ図鑑</h1>
      <div class="mode-toggle" id="modeToggle">
        <button class="mode-btn on" data-mode="genre">ジャンル別</button>
        <button class="mode-btn" data-mode="month">月別</button>
      </div>
      <div class="chips" id="chips">
        <button class="chip NPB on" data-genre="NPB">NPB</button>
        <button class="chip KBO on" data-genre="KBO">KBO</button>
        <button class="chip CPBL on" data-genre="CPBL">CPBL</button>
        <button class="chip Jリーグ on" data-genre="Jリーグ">Jリーグ</button>
        <button class="chip その他 on" data-genre="その他">その他</button>
      </div>
      <div style="flex:1"></div>
      <a class="nav" href="map.html">🗺️ 地図表示</a>

    </header>
    <main id="main">
      <div class="empty">読み込み中…</div>
    </main>

    <div class="overlay" id="overlay">
      <div class="modal" id="modalBody"></div>
    </div>

    <script>
      const GENRE_ORDER = ["NPB", "KBO", "CPBL", "Jリーグ", "その他"];
      const GENRE_COLOR = { NPB: "#2563eb", KBO: "#ea580c", CPBL: "#dc2626", Jリーグ: "#16a34a", その他: "#7c3aed" };
      let activeGenres = new Set(GENRE_ORDER);
      let itemsCache = [];
      let itemsById = {};
      let groupMode = "genre"; // "genre" | "month"

      function esc(s) {
        return (s == null ? "" : String(s)).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      }

      function dateRange(it) {
        const s = it.startDate || "";
        const e = it.endDate || "";
        if (!s && !e) return "日程未定";
        return s + (e && e !== s ? " 〜 " + e : "");
      }

      function cardHtml(it) {
        const g = GENRE_ORDER.includes(it.genre) ? it.genre : "その他";
        let html = '<div class="card ' + g + '" data-id="' + esc(it.id) + '">';
        html += '<div class="name">' + esc(it.name || it.id) + "</div>";
        if (it.municipality) html += '<div class="muni">📍 ' + esc(it.municipality) + "</div>";
        html += '<div class="dates">' + esc(dateRange(it)) + "</div>";
        if (it.venue) html += '<div class="venue">' + esc(it.venue) + "</div>";
        const infoParts = [];
        if (it.publicInfo) infoParts.push("公開/料金: " + it.publicInfo);
        if (it.parking) infoParts.push("駐車場: " + it.parking);
        if (infoParts.length) html += '<div class="info">' + esc(infoParts.join(" ／ ")) + "</div>";
        const links = [];
        if (it.official) links.push('<a href="' + esc(it.official) + '" target="_blank" rel="noopener">🔗 公式サイト</a>');
        if (it.sns) links.push('<a href="' + esc(it.sns) + '" target="_blank" rel="noopener">📣 SNS</a>');
        if (links.length) html += '<div class="links">' + links.join("") + "</div>";
        html += "</div>";
        return html;
      }

      function monthOf(it) {
        const d = it.startDate || it.endDate;
        if (!d) return null;
        const m = parseInt(String(d).slice(5, 7), 10);
        return m >= 1 && m <= 12 ? m : null;
      }

      function sectionHtml(barHtml, titleText, list) {
        list.sort((a, b) => (a.startDate || "").localeCompare(b.startDate || ""));
        let html = '<section class="genre-section">';
        html += '<div class="genre-title">' + barHtml + esc(titleText) + ' <span class="count">' + list.length + "件</span></div>";
        html += '<div class="grid">' + list.map(cardHtml).join("") + "</div>";
        html += "</section>";
        return html;
      }

      function render(items) {
        const main = document.getElementById("main");
        if (!items.length) {
          main.innerHTML = '<div class="empty">レコードがありません</div>';
          return;
        }
        const visible = items.filter((it) => activeGenres.has(GENRE_ORDER.includes(it.genre) ? it.genre : "その他"));

        let html = "";
        if (groupMode === "genre") {
          const byGenre = {};
          for (const g of GENRE_ORDER) byGenre[g] = [];
          for (const it of visible) byGenre[GENRE_ORDER.includes(it.genre) ? it.genre : "その他"].push(it);
          for (const g of GENRE_ORDER) {
            const list = byGenre[g];
            if (!list.length) continue;
            const bar = '<span class="bar" style="background:' + GENRE_COLOR[g] + ";color:" + GENRE_COLOR[g] + '"></span>';
            html += sectionHtml(bar, g, list);
          }
        } else {
          const byMonth = {};
          for (let m = 1; m <= 12; m++) byMonth[m] = [];
          const none = [];
          for (const it of visible) {
            const m = monthOf(it);
            if (m) byMonth[m].push(it);
            else none.push(it);
          }
          const bar = '<span class="bar month"></span>';
          for (let m = 1; m <= 12; m++) {
            if (!byMonth[m].length) continue;
            html += sectionHtml(bar, m + "月", byMonth[m]);
          }
          if (none.length) html += sectionHtml(bar, "日程未定", none);
        }
        main.innerHTML = html || '<div class="empty">該当するチームがありません</div>';
        main.querySelectorAll(".card").forEach((el) => {
          el.onclick = () => openDetail(el.dataset.id);
        });
      }

      function openDetail(id) {
        const it = itemsById[id];
        if (!it) return;
        let html = '<div class="name">' + esc(it.name || it.id) + "</div>";
        html += '<div class="row"><b>ジャンル:</b> ' + esc(it.genre || "") + "</div>";
        if (it.municipality || it.venue) html += '<div class="row"><b>場所:</b> ' + esc(it.municipality || "") + (it.venue ? " / " + esc(it.venue) : "") + "</div>";
        const dr = dateRange(it);
        if (dr) html += '<div class="row"><b>日程:</b> ' + esc(dr) + "</div>";
        if (it.publicInfo) html += '<div class="row"><b>公開/料金:</b> ' + esc(it.publicInfo) + "</div>";
        if (it.parking) html += '<div class="row"><b>駐車場:</b> ' + esc(it.parking) + "</div>";
        if (it.notes) html += '<div class="row"><b>備考:</b> ' + esc(it.notes) + "</div>";
        if (it.official) html += '<div class="row"><b>公式:</b> <a href="' + esc(it.official) + '" target="_blank" rel="noopener" style="color:#9ec5ff">サイトを開く</a></div>';
        if (it.sns) html += '<div class="row"><b>SNS:</b> <a href="' + esc(it.sns) + '" target="_blank" rel="noopener" style="color:#9ec5ff">開く</a></div>';
        html += '<button class="close" id="closeModal">閉じる</button>';
        document.getElementById("modalBody").innerHTML = html;
        document.getElementById("overlay").classList.add("open");
        document.getElementById("closeModal").onclick = closeDetail;
      }

      function closeDetail() {
        document.getElementById("overlay").classList.remove("open");
      }

      document.getElementById("overlay").addEventListener("click", (e) => {
        if (e.target.id === "overlay") closeDetail();
      });

      document.getElementById("modeToggle").addEventListener("click", (e) => {
        const btn = e.target.closest(".mode-btn");
        if (!btn || btn.classList.contains("on")) return;
        groupMode = btn.dataset.mode;
        document.querySelectorAll(".mode-btn").forEach((b) => b.classList.toggle("on", b === btn));
        render(itemsCache);
      });

      document.getElementById("chips").addEventListener("click", (e) => {
        const chip = e.target.closest(".chip");
        if (!chip) return;
        const g = chip.dataset.genre;
        if (activeGenres.has(g)) {
          activeGenres.delete(g);
          chip.classList.remove("on");
        } else {
          activeGenres.add(g);
          chip.classList.add("on");
        }
        render(itemsCache);
      });

      async function load() {
        const res = await fetch("data.json");
        if (!res.ok) throw new Error("読み込み失敗 (" + res.status + ")");
        return res.json();
      }

      async function main() {
        itemsCache = await load();
        itemsById = Object.fromEntries(itemsCache.map((it) => [it.id, it]));
        render(itemsCache);
      }

      main().catch((e) => {
        document.getElementById("main").innerHTML = '<div class="err">読み込みに失敗しました: ' + esc(e.message) + "</div>";
      });
    </script>
  </body>
</html>
